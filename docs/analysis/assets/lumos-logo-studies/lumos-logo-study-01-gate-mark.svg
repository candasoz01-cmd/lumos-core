<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Lumos gate mark study</title>
  <desc id="desc">Draft Lumos logo mark: a quiet illuminated gateway with warm gold and teal accents.</desc>
  <defs>
    <linearGradient id="gold" x1="146" y1="70" x2="366" y2="444" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6ead0"/>
      <stop offset="0.5" stop-color="#d4a574"/>
      <stop offset="1" stop-color="#9f7440"/>
    </linearGradient>
    <linearGradient id="teal" x1="134" y1="128" x2="380" y2="384" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7dded1"/>
      <stop offset="1" stop-color="#1b9f93"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="246" r="172" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6ead0" stop-opacity="0.22"/>
      <stop offset="0.48" stop-color="#2dd4bf" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#05070c" flood-opacity="0.28"/>
    </filter>
