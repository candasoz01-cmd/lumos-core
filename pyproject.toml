[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lumos-core"
version = "0.1.0"
description = "Lumos core CLI and read-only web"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
  "cryptography>=42",
  "openai>=1.0",
]

[project.scripts]
lumos = "lumos_core.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.poetry]
package-mode = false
