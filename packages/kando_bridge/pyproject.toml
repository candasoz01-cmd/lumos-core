[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kando-bridge"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "kando-runtime>=0.1.0",
]

[project.optional-dependencies]
stt = [
  "faster-whisper>=1.2,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
