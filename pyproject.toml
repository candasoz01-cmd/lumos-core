[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lumos-core"
version = "0.1.0"
description = "Lumos core CLI"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
  "cryptography>=42",
  "openai>=1.0",
]

[project.optional-dependencies]
quantum = [
  "qiskit>=1.0",
  "qiskit-aer>=0.14",
]
representative = [
  "faster-whisper>=1.0",
  "sounddevice>=0.4",
]
quantum-ibm = [
  "qiskit-ibm-runtime",
]
quantum-azure = [
  "qdk[azure]",
]
quantum-aws = [
  "boto3",
]
quantum-google = [
  "cirq-google",
]

[project.scripts]
lumos = "lumos_core.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.poetry]
package-mode = false
