# Required CheckRuns `claim-guard` and `write-attestation` must never be
# SKIPPED. GitHub records a skipped job as a completed CheckRun of that
# name; once the name is required, a pull_request_target sibling that
# skips the job can block merge even when the pull_request run succeeded.
# This file is pull_request-only. The trusted HMAC job lives in
# write-attestation-trusted.yml (pull_request_target only; not required).
#
# 1. claim-guard (board): PR writes vs central Lumos Board
#    (refs/heads/claude/lumos-board). Lumos-Claim / Lumos-Agent trailers.
#    Git author fields are not evidence. Unreadable board = failure.
#    Secret is NEVER in this job.
#
# 2. write-attestation (HMAC, GitHub proof on this PR): public CI proof
#    key, NOT secrets.LUMOS_WRITE_GATE_SECRET, so untrusted PR code never
#    receives the production secret. A commit without
#    Lumos-Claim-Attestation fails (CLAIM_GUARD_MISSING_ATTESTATION).
#    The proof key cannot authorize production writes.
#
# A green board CheckRun is not HMAC proof. A green HMAC CheckRun is not
# a central lock proof. Both must pass.
#
# 88b308cf is left unattested on purpose. #935 stays draft. 9a113ced is
# not rewritten.
name: Claim guard

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: claim-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claim-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Fetch central board
        run: git fetch --no-tags origin +refs/heads/claude/lumos-board:refs/remotes/origin/claude/lumos-board

      - name: Check PR writes against central claims
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          PR_REF: ${{ github.repository }}#${{ github.event.pull_request.number }}
        run: |
          PYTHONPATH=src python -m lumos_board.claim_guard \
            --base "$BASE_SHA" --head "$HEAD_SHA" --branch "$HEAD_REF" --pr "$PR_REF"

  write-attestation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Reject commits without HMAC write attestation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Public proof key only. Production secret is never injected here.
          LUMOS_WRITE_GATE_SECRET: lumos-ci-write-attestation-proof-not-prod-32
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 -m lumos_board.write_attestation \
            --repo . --base "$BASE_SHA" --head "$HEAD_SHA"
