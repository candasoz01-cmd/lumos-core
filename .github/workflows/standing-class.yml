# ADR-028 standing-class gate.
# eligible (exit 0) → job green (standing merge may proceed only if the rest of ADR-028 holds).
# semantic_review (exit 3) → job red. Path alone cannot decide. NOT a permanent ban:
#   run the classifier again with a head-SHA-bound attestation
#     --head-sha <head> --attest factual|normative --attest-sha <head>
#   factual promotes to eligible, normative demotes to excluded. This job runs
#   WITHOUT an attestation on purpose: CI reports the path class only, it does not
#   make the olgu/norm judgement. Attestation belongs to the merge decision.
# excluded / unlisted / empty (exit 2) → job red. Fail-closed.
# Red is a standing-merge prohibition, not a human-merge prohibition.
# Do not add this job to GitHub required_status_checks: that would also block
# human-approved excluded PRs. Physical lock needs a separate merge-authority model.
# required_status_checks on main is still empty; GitHub will not physically block.
# Agents must still refuse standing merge when this job fails. Incident: #777 / TD-20.
name: standing-class

on:
  pull_request:

permissions:
  contents: read

jobs:
  standing-class:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Classify changed paths
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          mapfile -t files < <(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          python3 -m standing_merge.classify "${files[@]}"
