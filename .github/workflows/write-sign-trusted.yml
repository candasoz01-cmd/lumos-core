# Production signer for the write gate.
# write-attestation-trusted only verifies. This job creates new commits.
#
# GitHub opens the lumos-write-gate environment for refs/heads/main after
# the required reviewer approves. The production secret is injected there
# and is never written to the log by this file. pull_request does not run
# this workflow, and the PR tree is fetched as data, not checked out as code.
#
# The introducing change cannot sign itself: the workflow file has to be on
# main before workflow_dispatch can select it. That is bootstrap, not a
# verifier bypass.
name: Write sign trusted

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to copy onto trusted-sign/pr-<number>"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: write-sign-trusted-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  write-sign-trusted:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: lumos-write-gate
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Refuse a non-main ref
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Fetch the pull request as data
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$PR_NUMBER" in
            ''|*[!0-9]*)
              echo "pr_number must be digits" >&2
              exit 2
              ;;
          esac
          git fetch --no-tags origin \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr-${PR_NUMBER}-head"
          BASE="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .base.sha)"
          HEAD="$(git rev-parse "refs/remotes/origin/pr-${PR_NUMBER}-head")"
          SOURCE="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.ref)"
          printf '%s\n%s\n%s\n' "$BASE" "$HEAD" "$SOURCE" > "${RUNNER_TEMP}/sign-request"

      - name: Sign onto a new branch
        env:
          LUMOS_WRITE_GATE_SECRET: ${{ secrets.LUMOS_WRITE_GATE_SECRET }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          mapfile -t req < "${RUNNER_TEMP}/sign-request"
          python3 -m lumos_board.trusted_sign \
            --repo . \
            --base "${req[0]}" \
            --head "${req[1]}" \
            --source-branch "${req[2]}" \
            --dest "trusted-sign/pr-${PR_NUMBER}" \
            --central \
            --push origin
