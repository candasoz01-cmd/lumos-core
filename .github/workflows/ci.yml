name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff check (OD-059 Paket B — pre-commit parity)
        run: ruff check .

      - name: Set PYTHONPATH
        run: |
          echo "PYTHONPATH=$(pwd)/src:$(pwd)/packages/kando_runtime/src:$(pwd)/packages/kando_bridge/src" >> $GITHUB_ENV

      - name: Run tests
        run: pytest
        env:
          KANDO_MOCK: "1"

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo test (AnchorUSB)
        run: cargo test -p anchorusb-core -p anchorusb-cli

  macos-app-build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: macos/LumosApp
    steps:
      - uses: actions/checkout@v4

      - name: Build signed app bundle (ad-hoc CI signature)
        run: ./build-app.sh

      - name: Package app artifact
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/Lumos.app dist/Lumos-macOS.zip
          shasum -a 256 dist/Lumos-macOS.zip > dist/Lumos-macOS.zip.sha256

      - name: Upload macOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumos-macOS
          path: |
            macos/LumosApp/dist/Lumos-macOS.zip
            macos/LumosApp/dist/Lumos-macOS.zip.sha256

  ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}

      - name: Install Playwright Chromium
        working-directory: ui
        run: npx playwright install chromium --with-deps

      - name: Build UI
        working-directory: ui
        run: npm run build

      - name: Run UI smoke (OD-046 v2)
        working-directory: ui
        run: npm run e2e:smoke

  ui-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}

      - name: Install Playwright Chromium
        working-directory: ui
        run: npx playwright install chromium --with-deps

      - name: Build UI
        working-directory: ui
        run: npm run build

      - name: Run package-local E2E (OD-046 Faz 4)
        working-directory: ui
        run: npm run e2e:package:local

      - name: Run package-api E2E (OD-046 Faz 4)
        working-directory: ui
        run: npm run e2e:package:api

      - name: Run confirmation-panel-api E2E (Faz-2)
        working-directory: ui
        run: npm run e2e:confirmation:api

      - name: Run tasks-offline-online E2E (OD-046 Faz 4)
        working-directory: ui
        run: npm run e2e:tasks-offline-online
