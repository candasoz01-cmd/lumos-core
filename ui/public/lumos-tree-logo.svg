<?xml version="1.0" encoding="UTF-8"?>
<!--
  Lumos tree mark: symmetric tree-of-life silhouette (core symbol, not skull).
  Palette: near-black navy field, warm antique gold strokes, cool blue/cyan rim glow (not green-teal).
-->
