[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lumos-social"
version = "0.1.0"
description = "Lumos social layer: connector interface, event bus, mock connectors"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["typer>=0.9"]

[project.optional-dependencies]
toml = ["tomli>=2.0; python_version<'3.11'"]
dev = ["pytest>=7", "ruff>=0.4", "mypy>=1.0"]

[project.scripts]
lumos-social = "lumos_social.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# ---- Ruff: lint + format ----
[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]
exclude = [".venv", "build", "dist", ".git"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ---- Pytest ----
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

# ---- Mypy (şimdilik çok katı değil) ----
[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_ignores = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
packages = ["lumos_social"]
ignore_missing_imports = true
