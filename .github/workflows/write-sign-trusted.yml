# Production signer for the write gate.
# write-attestation-trusted only verifies. This job creates new commits.
#
# Order: preview the exact range, then the lumos-write-gate reviewer
# approves that compare URL, then the signer copies the same range.
# A later head does not match the approved manifest and is not signed.
# The production secret is injected only in the sign job and is never
# written to the log. pull_request does not run this workflow, and the
# PR tree is fetched as data, not checked out as code.
#
# The introducing change cannot sign itself: the workflow file has to be
# on main before workflow_dispatch can select it. That is bootstrap, not
# a verifier bypass. Environment approval is not a merge approval.
name: Write sign trusted

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to copy onto trusted-sign/pr-<number>"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: write-sign-trusted-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  preview:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    outputs:
      compare_url: ${{ steps.manifest.outputs.compare_url }}
      base: ${{ steps.manifest.outputs.base }}
      head: ${{ steps.manifest.outputs.head }}
      source: ${{ steps.manifest.outputs.source }}
      dest: ${{ steps.manifest.outputs.dest }}
    steps:
      - name: Refuse a non-main ref
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Fetch the pull request as data
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$PR_NUMBER" in
            ''|*[!0-9]*)
              echo "pr_number must be digits" >&2
              exit 2
              ;;
          esac
          git fetch --no-tags origin \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr-${PR_NUMBER}-head"
          BASE="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .base.sha)"
          HEAD="$(git rev-parse "refs/remotes/origin/pr-${PR_NUMBER}-head")"
          SOURCE="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.ref)"
          printf '%s\n%s\n%s\n' "$BASE" "$HEAD" "$SOURCE" > "${RUNNER_TEMP}/sign-request"

      - name: Record the change that approval will cover
        id: manifest
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t req < "${RUNNER_TEMP}/sign-request"
          python3 -m lumos_board.trusted_sign preview \
            --repo . \
            --base "${req[0]}" \
            --head "${req[1]}" \
            --source-branch "${req[2]}" \
            --dest "trusted-sign/pr-${PR_NUMBER}" \
            --repo-slug "${GITHUB_REPOSITORY}" \
            > "${RUNNER_TEMP}/manifest.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path(os.environ["RUNNER_TEMP"], "manifest.json").read_text(encoding="utf-8"))
          if manifest.get("grants_merge") is not False:
              raise SystemExit(2)
          lines = [
              "## Onaylanacak değişiklik",
              "",
              "Bu ekran imza öncesidir. Onay merge izni değildir.",
              "",
              f"- PR: #{os.environ['PR_NUMBER']}",
              f"- Kaynak dal: `{manifest['source_branch']}`",
              f"- Aralık: `{manifest['base']}` ... `{manifest['head']}`",
              f"- Hedef: `{manifest['dest']}`",
              f"- Karşılaştırma: {manifest['compare_url']}",
              "",
          ]
          for commit in manifest["commits"]:
              lines.append(f"- `{commit['sha'][:12]}` {commit['subject']}")
              for path in commit["paths"]:
                  lines.append(f"  - `{path}`")
          text = "\n".join(lines) + "\n"
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(text, encoding="utf-8")
          Path(os.environ["RUNNER_TEMP"], "approval.txt").write_text(text, encoding="utf-8")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"compare_url={manifest['compare_url']}\n")
              handle.write(f"base={manifest['base']}\n")
              handle.write(f"head={manifest['head']}\n")
              handle.write(f"source={manifest['source_branch']}\n")
              handle.write(f"dest={manifest['dest']}\n")
          PY
          gh pr comment "$PR_NUMBER" --body-file "${RUNNER_TEMP}/approval.txt"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sign-manifest
          path: ${{ runner.temp }}/manifest.json
          if-no-files-found: error
          retention-days: 1

  sign:
    needs: preview
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: lumos-write-gate
      url: ${{ needs.preview.outputs.compare_url }}
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      signed_pr: ${{ steps.open.outputs.number }}
    steps:
      - name: Refuse a non-main ref
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sign-manifest
          path: ${{ runner.temp }}

      - name: Re-read the pull request head
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$PR_NUMBER" in
            ''|*[!0-9]*)
              echo "pr_number must be digits" >&2
              exit 2
              ;;
          esac
          git fetch --no-tags origin \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr-${PR_NUMBER}-head"
          BASE="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .base.sha)"
          HEAD="$(git rev-parse "refs/remotes/origin/pr-${PR_NUMBER}-head")"
          SOURCE="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.ref)"
          printf '%s\n%s\n%s\n' "$BASE" "$HEAD" "$SOURCE" > "${RUNNER_TEMP}/sign-request"

      - name: Sign the approved range onto a new branch
        env:
          LUMOS_WRITE_GATE_SECRET: ${{ secrets.LUMOS_WRITE_GATE_SECRET }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          mapfile -t req < "${RUNNER_TEMP}/sign-request"
          python3 -m lumos_board.trusted_sign \
            --repo . \
            --base "${req[0]}" \
            --head "${req[1]}" \
            --source-branch "${req[2]}" \
            --dest "trusted-sign/pr-${PR_NUMBER}" \
            --repo-slug "${GITHUB_REPOSITORY}" \
            --manifest-file "${RUNNER_TEMP}/manifest.json" \
            --central \
            --push origin \
            > "${RUNNER_TEMP}/signed.json"

      - name: Open a draft for the automatic checks
        id: open
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          GH_TOKEN: ${{ github.token }}
          DEST: ${{ needs.preview.outputs.dest }}
          COMPARE_URL: ${{ needs.preview.outputs.compare_url }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --head "$DEST" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "number=${existing}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cat > "${RUNNER_TEMP}/draft.txt" <<EOF
          Signed copy of #${PR_NUMBER}.
          The lumos-write-gate approval covered ${COMPARE_URL}.
          That approval is not a merge approval.
          If the automatic checks fail, this workflow stops.
          EOF
          url="$(gh pr create --draft --base main --head "$DEST" --title "Signed copy of #${PR_NUMBER} (not a merge approval)" --body-file "${RUNNER_TEMP}/draft.txt")"
          number="$(gh pr view "$url" --json number --jq .number)"
          echo "number=${number}" >> "$GITHUB_OUTPUT"

  watch:
    needs: [preview, sign]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Refuse a non-main ref
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Stop when a required check fails
        env:
          SIGNED_PR: ${{ needs.sign.outputs.signed_pr }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$SIGNED_PR" in
            ''|*[!0-9]*)
              echo "signed pull request number missing" >&2
              exit 2
              ;;
          esac
          for _ in $(seq 1 60); do
            gh pr view "$SIGNED_PR" --json statusCheckRollup > "${RUNNER_TEMP}/rollup.json"
            set +e
            python3 -m lumos_board.trusted_sign judge-checks \
              --file "${RUNNER_TEMP}/rollup.json" > "${RUNNER_TEMP}/verdict.json"
            code=$?
            set -e
            pending="$(python3 -c 'import json,os; print(len(json.load(open(os.environ["RUNNER_TEMP"]+"/verdict.json"))["pending"]))')"
            if [ "$pending" = "0" ]; then
              {
                echo "## Kontrol sonucu"
                echo
                echo "Bu sonuç merge izni değildir."
                echo
                echo '```json'
                cat "${RUNNER_TEMP}/verdict.json"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit "$code"
            fi
            sleep 30
          done
          echo "checks stayed pending" >&2
          exit 2
