# ADR-028 standing-class gate.
#
# Verdicts (CLI exit codes):
#   eligible (0)        → job green. Standing merge may proceed only if the rest
#                         of ADR-028 also holds.
#   semantic_review (3) → job red. Path alone cannot decide. NOT a permanent ban:
#                         re-run with a head-SHA-bound attestation
#                           --head-sha <head> --attest factual|normative --attest-sha <head>
#                         factual promotes to eligible, normative demotes to excluded.
#                         This job runs WITHOUT an attestation on purpose: CI reports
#                         the path class only; the olgu/norm judgement belongs to the
#                         merge decision, not to CI.
#   excluded (2)        → job red. Hard exclusion, unlisted path, dash-prefixed path,
#                         or empty diff. Fail-closed.
#
# Red is a standing-merge prohibition, not a human-merge prohibition.
# Do not add this job to GitHub required_status_checks: that would also block
# human-approved excluded PRs. Physical lock needs a separate merge-authority model.
#
# TRUST ROOT (Security Reviewer HIGH, 2026-08-21): the classifier that judges a PR
# must not come from that PR. Both the module and the rules file are extracted from
# the pull request's fixed `base.sha` into a separate directory and run from there.
# A PR can therefore not rewrite `src/standing_merge/**` to grade itself.
# If the base commit has no classifier, this job FAILS CLOSED — it never falls back
# to the PR tree. That is expected for the bootstrap PR that first introduces the
# classifier; that PR is governance class and needs explicit human approval anyway.
#
# Path transport is NUL-delimited and passed after `--`, because a repository file
# may be named `--help` or `--attest=factual` and may contain newlines.
# Incident: #777 / TD-20.
name: standing-class

on:
  pull_request:

permissions:
  contents: read

jobs:
  standing-class:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract trusted classifier from base SHA
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test -n "$BASE_SHA"
          git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null || true
          if ! git cat-file -e "${BASE_SHA}:src/standing_merge/classify.py" 2>/dev/null; then
            echo "::error::Base commit ${BASE_SHA} has no trusted classifier."
            echo "::error::Fail-closed: refusing to grade this PR with its own code."
            exit 1
          fi
          rm -rf "${RUNNER_TEMP}/trusted"
          mkdir -p "${RUNNER_TEMP}/trusted"
          git archive "$BASE_SHA" src/standing_merge \
            | tar -x -C "${RUNNER_TEMP}/trusted"
          echo "Trusted classifier extracted from ${BASE_SHA}"

      - name: Classify changed paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PYTHONPATH: ${{ runner.temp }}/trusted/src
        run: |
          set -euo pipefail
          mapfile -d '' -t files < <(git diff --name-only -z "${BASE_SHA}...HEAD")
          python3 -m standing_merge.classify -- ${files[@]+"${files[@]}"}
