# Layer 1A — read-only 30-minute production pulse.
# No secrets, LLM, or panel writes. JSON artifact only.
# GitHub's default Actions failure notification may still fire if this job is red.
name: Layer 1A pulse

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Cache unused for 7 days is evicted (accepted operational limit; see README).
      - name: Restore last_success_at
        uses: actions/cache/restore@v4
        with:
          path: layer1a-state.json
          key: layer1a-state-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            layer1a-state-${{ github.ref_name }}-

      - name: Run five deterministic checks
        id: checks
        continue-on-error: true
        run: python3 ops/layer1a/run.py --output layer1a-result.json --state layer1a-state.json

      - name: Save last_success_at
        if: always()
        uses: actions/cache/save@v4
        with:
          path: layer1a-state.json
          key: layer1a-state-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload JSON artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layer1a-result
          path: layer1a-result.json
          if-no-files-found: error
          retention-days: 14
