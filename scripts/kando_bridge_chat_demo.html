<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lumos bridge — POST /chat demo</title>
</head>
<body>
  <p>
    <input type="text" placeholder="Mesaj" size="60" />
    <button type="button" onclick="sendMessage()">Send</button>
  </p>
  <pre id="out"></pre>

  <script>
    // Render&apos;da KANDO_BRIDGE_SECRET varsa: ?token=... ekleyin veya aşağıyı doldurun.
    const BRIDGE_TOKEN =
      new URLSearchParams(location.search).get("token") || "";

    const CHAT_URL =
      new URLSearchParams(location.search).get("base") ||
      "https://lumos-core-2.onrender.com/chat";

    async function sendMessage() {
      const input = document.querySelector("input");
      const out = document.querySelector("#out");

      out.innerText = "Gönderiliyor...";

      try {
        const headers = {
          "Content-Type": "application/json",
        };
        if (BRIDGE_TOKEN) {
          headers["X-Kando-Token"] = BRIDGE_TOKEN;
        }

        const r = await fetch(CHAT_URL, {
          method: "POST",
          headers,
          body: JSON.stringify({
            message: input.value,
          }),
        });

        const text = await r.text();
        let data;
        try {
          data = JSON.parse(text);
        } catch {
          data = { raw: text.slice(0, 2000), status: r.status };
        }

        console.log("RESPONSE:", data);

        out.innerText = JSON.stringify(data, null, 2);
      } catch (e) {
        console.error(e);
        out.innerText = "ERROR: " + e.message;
      }
    }
  </script>
</body>
</html>
