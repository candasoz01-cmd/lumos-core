# Two independent checks, one workflow. Neither substitutes for the other.
#
# 1. claim-guard (board): PR writes vs central Lumos Board
#    (refs/heads/claude/lumos-board). Lumos-Claim / Lumos-Agent trailers.
#    Git author fields are not evidence. Unreadable board = failure.
#    Runs on pull_request so this introducing HMAC PR still gets the #936
#    board CheckRun from the PR file. Secret is NEVER in this job.
#
# 2. write-attestation (HMAC): commit-bound Lumos-Claim-Attestation, one-shot
#    write token, unique attestation_id. issued_at is not issuance proof.
#    Orchestrator is pull_request_target; verifier is materialized from
#    base.sha; LUMOS_WRITE_GATE_SECRET is injected only on the trusted
#    PYTHONPATH step. Untrusted PR code never sees the secret.
#
# A green board CheckRun is not HMAC proof. A green HMAC CheckRun is not
# a central lock proof. Both must pass. Making either a required GitHub
# check is a founder Settings action (this token gets HTTP 403).
#
# BOOTSTRAP: write-attestation cannot self-prove until this file is on the
# PR base. 9a113ced on #935 is not rewritten. #935 stays draft.
name: Claim guard

on:
  pull_request:
  pull_request_target:

permissions:
  contents: read

concurrency:
  group: claim-guard-${{ github.event.pull_request.number }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  claim-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Fetch central board
        run: git fetch --no-tags origin +refs/heads/claude/lumos-board:refs/remotes/origin/claude/lumos-board

      - name: Check PR writes against central claims
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          PR_REF: ${{ github.repository }}#${{ github.event.pull_request.number }}
        run: |
          PYTHONPATH=src python -m lumos_board.claim_guard \
            --base "$BASE_SHA" --head "$HEAD_SHA" --branch "$HEAD_REF" --pr "$PR_REF"

  write-attestation:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Materialize trusted verifier from base SHA
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          test -n "$BASE_SHA"
          rm -rf "${RUNNER_TEMP}/trusted"
          python3 -m lumos_board.claim_guard_trust \
            --repo . --base-sha "$BASE_SHA" --dest "${RUNNER_TEMP}/trusted"

      - name: Fetch PR head as data
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"

      - name: Verify HMAC write attestations
        env:
          PYTHONPATH: ${{ runner.temp }}/trusted/src
          LUMOS_WRITE_GATE_SECRET: ${{ secrets.LUMOS_WRITE_GATE_SECRET }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse refs/remotes/pr/head)"
          python3 -m lumos_board.write_attestation \
            --repo . --base "$BASE_SHA" --head "$HEAD_SHA"
