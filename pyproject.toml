[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lumos-core"
dynamic = ["version"]
description = "Lumos core CLI and read-only web"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
  "cryptography>=42",
  "openai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.1"]

[tool.setuptools.dynamic]
version = {attr = "lumos_core.version.VERSION"}

[project.scripts]
lumos = "lumos_core.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["lumos_core*"]
# Tek top-level paket: src/lumos_core. src/ altına yeni paket eklenmez.
