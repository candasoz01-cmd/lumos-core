name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff check (OD-059 Paket B — pre-commit parity)
        run: ruff check .

      - name: Set PYTHONPATH
        run: |
          echo "PYTHONPATH=$(pwd)/src:$(pwd)/packages/kando_runtime/src:$(pwd)/packages/kando_bridge/src" >> $GITHUB_ENV

      - name: Run tests
        run: pytest
        env:
          KANDO_MOCK: "1"

  ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: ui
        run: npx playwright install chromium --with-deps

      - name: Build UI
        working-directory: ui
        run: npm run build

      - name: Run UI smoke (OD-046 v2)
        working-directory: ui
        run: npm run e2e:smoke

  ui-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: ui
        run: npx playwright install chromium --with-deps

      - name: Build UI
        working-directory: ui
        run: npm run build

      - name: Run package-local E2E (OD-046 Faz 4)
        working-directory: ui
        run: npm run e2e:package:local

      - name: Run package-api E2E (OD-046 Faz 4)
        working-directory: ui
        run: npm run e2e:package:api

      - name: Run tasks-offline-online E2E (OD-046 Faz 4)
        working-directory: ui
        run: npm run e2e:tasks-offline-online
