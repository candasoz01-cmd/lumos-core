<?xml version="1.0" encoding="UTF-8"?>
<!--
  Canonical We Lock AI / Lumos compact mark.
  Layers: tree = core identity, crescent = supporting field, star = quantum core.
  Service variants must keep this geometry intact and add only a secondary badge/accent.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="lumos-tree-logo-title">
  <title id="lumos-tree-logo-title">We Lock AI · Lumos</title>
  <defs>
    <linearGradient id="brand-gold" x1="14" y1="7" x2="48" y2="57" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff4cf"/>
      <stop offset="0.42" stop-color="#e6bd63"/>
      <stop offset="1" stop-color="#8f611d"/>
    </linearGradient>
    <radialGradient id="brand-core" cx="32" cy="22" r="18" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.9"/>
      <stop offset="0.18" stop-color="#efc45d" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#efc45d" stop-opacity="0"/>
    </radialGradient>
    <mask id="brand-crescent-mask">
      <rect width="64" height="64" fill="black"/>
      <circle cx="29" cy="30" r="24" fill="white"/>
      <circle cx="38" cy="25" r="23" fill="black"/>
    </mask>
  </defs>

  <circle cx="32" cy="24" r="18" fill="url(#brand-core)"/>
  <circle cx="29" cy="30" r="24" fill="url(#brand-gold)" opacity="0.32" mask="url(#brand-crescent-mask)"/>

  <g fill="none" stroke="url(#brand-gold)" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round">
    <path d="M30.2 47Q30.8 38 31.2 30.5M33.8 47Q33.2 38 32.8 30.5"/>
    <path d="M31.5 30Q24 22 17 14M31.8 28Q26 16 20 10M32 26Q28 12 24 8M31.2 31Q22 26 12 20"/>
    <path d="M32.5 30Q40 22 47 14M32.2 28Q38 16 44 10M32 26Q36 12 40 8M32.8 31Q42 26 52 20"/>
    <path d="M32 24Q28 12 25 8M32 24Q36 12 39 8"/>
    <path d="M31 45Q25 51 19 55M33 45Q39 51 45 55M31.5 46Q28 51 26 54M32.5 46Q36 51 38 54"/>
  </g>

  <g fill="#fff7d6" stroke="#d9a942" stroke-width="0.55" aria-hidden="true">
