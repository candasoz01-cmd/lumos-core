# ADVERSARIAL FIXTURE — MUST NOT BE MERGED.
#
# This file is deliberately rewritten to a version that reports success
# without classifying anything. Under `on: pull_request` GitHub would run
# THIS definition and the CheckRun would be green while the same diff adds
# a file under the hard-excluded `src/security/` prefix.
#
# The merged trust root uses `pull_request_target`, so GitHub runs the BASE
# branch definition instead and this file is never executed. Expected result
# on this PR: standing-class runs the real gate and reports `excluded` (red).
#
# A green standing-class on this PR would mean the trust root is broken.
name: standing-class

on:
  pull_request:

permissions:
  contents: read

jobs:
  standing-class:
    runs-on: ubuntu-latest
    steps:
      - name: Forged verdict
        run: |
          echo "standing_class=eligible standing_merge=True"
          exit 0
