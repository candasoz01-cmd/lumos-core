<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Lumos Panel — Kamera testi</title>
  <style>
    :root {
      --bg: #111;
      --bg-card: #1e1e1e;
      --border: #3a3a3a;
      --text: #e8e8e8;
      --text-muted: #aaa;
      --link: #7eb8ff;
      --accent: #38ceff;
      --danger: #f0b4b4;
      --radius: 10px;
      --spacing: 1rem;
      --btn-min-h: 3rem;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 16px;
      color: var(--text);
      background: var(--bg);
      -webkit-text-size-adjust: 100%;
    }

    body {
      padding-bottom: calc(var(--spacing) + var(--safe-bottom));
    }

    .page {
      max-width: 960px;
      margin: 0 auto;
      padding: var(--spacing);
    }

    .header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: var(--spacing);
    }

    .header h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 600;
    }

    .back-link {
      color: var(--link);
      text-decoration: none;
      font-size: 1rem;
      padding: 0.35rem 0;
    }

    .note {
      margin: 0 0 var(--spacing);
      padding: 0.75rem;
      border-radius: var(--radius);
      background: rgba(56, 206, 255, 0.08);
      border: 1px solid rgba(56, 206, 255, 0.22);
      color: var(--text-muted);
      line-height: 1.45;
      font-size: 0.9rem;
    }

    .error {
      display: none;
      margin: 0 0 var(--spacing);
      padding: 0.75rem;
      border-radius: var(--radius);
      background: rgba(240, 180, 180, 0.12);
      border: 1px solid rgba(240, 180, 180, 0.35);
      color: var(--danger);
      line-height: 1.45;
      font-size: 0.95rem;
    }

    .error.is-visible {
      display: block;
    }

    .live-section {
      margin-bottom: var(--spacing);
    }

    .video-shell {
      position: relative;
      width: 100%;
      min-height: min(62vh, 520px);
      max-height: 72vh;
      border-radius: var(--radius);
      overflow: hidden;
      background: #000;
      border: 1px solid var(--border);
    }

    #live-video {
      display: block;
      width: 100%;
      height: 100%;
      min-height: min(62vh, 520px);
      max-height: 72vh;
      object-fit: cover;
      background: #000;
    }

    .preview-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      text-align: center;
      color: var(--text-muted);
      pointer-events: none;
      font-size: 1rem;
    }

    .control-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.65rem;
      margin-top: 0.75rem;
    }

    .control-bar .btn-wide {
      grid-column: 1 / -1;
    }

    button {
      appearance: none;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #2d2d2d;
      color: var(--text);
      min-height: var(--btn-min-h);
      padding: 0.75rem 1rem;
      font: inherit;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:hover:not(:disabled),
    button:active:not(:disabled) {
      border-color: var(--accent);
    }

    button:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }

    button.primary {
      border-color: rgba(56, 206, 255, 0.55);
      background: rgba(56, 206, 255, 0.18);
    }

    button.capture-btn {
      border-color: rgba(198, 166, 106, 0.55);
      background: rgba(198, 166, 106, 0.16);
      font-size: 1.05rem;
    }

    .card {
      padding: var(--spacing);
      border-radius: var(--radius);
      background: var(--bg-card);
      border: 1px solid var(--border);
      margin-bottom: var(--spacing);
    }

    .card h2 {
      margin: 0 0 0.65rem;
      font-size: 1rem;
      font-weight: 600;
    }

    .capture-preview-wrap {
      position: relative;
      width: 100%;
      min-height: 220px;
      border-radius: var(--radius);
      overflow: hidden;
      background: #000;
      border: 1px solid var(--border);
    }

    #capture-preview {
      display: block;
      width: 100%;
      max-height: 50vh;
      object-fit: contain;
      background: #000;
    }

    #capture-preview[hidden] {
      display: none;
    }

    .debug-panel {
      margin: 0;
      padding: 0.75rem;
      border-radius: var(--radius);
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.78rem;
      line-height: 1.55;
      color: var(--text-muted);
      white-space: pre-wrap;
      word-break: break-word;
    }

    canvas {
      display: none;
    }

    @media (min-width: 640px) {
      .control-bar {
        grid-template-columns: repeat(3, 1fr);
      }

      .control-bar .btn-wide {
        grid-column: auto;
      }

      .control-bar .btn-capture-row {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.65rem;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="header">
      <a class="back-link" href="index.html">← Panele dön</a>
      <h1>Kamera testi</h1>
    </header>

    <p class="note" role="note">
      Yerel önizleme ve indirme — fotoğraf hiçbir yere yüklenmez.
      Kamera için <strong>http://localhost</strong> veya <strong>HTTPS</strong> kullanın;
      <code>file://</code> mobilde genelde çalışmaz.
    </p>

    <p id="error" class="error" role="alert" aria-live="assertive"></p>

    <section class="live-section" aria-labelledby="live-title">
      <h2 id="live-title" class="sr-only">Canlı önizleme</h2>
      <div class="video-shell">
        <video id="live-video" playsinline webkit-playsinline autoplay muted aria-label="Canlı kamera"></video>
        <div id="live-placeholder" class="preview-placeholder">Kamera kapalı — açmak için aşağıdaki düğmeye dokunun</div>
      </div>

      <div class="control-bar">
        <button type="button" id="btn-start" class="primary btn-wide">Kamerayı aç</button>
        <button type="button" id="btn-stop" disabled>Kapat</button>
        <button type="button" id="btn-switch" disabled title="Ön/arka kamera">Kamera değiştir</button>
        <div class="btn-capture-row btn-wide">
          <button type="button" id="btn-capture" class="capture-btn" disabled>Fotoğraf çek</button>
          <button type="button" id="btn-download" disabled>JPG indir</button>
        </div>
      </div>
    </section>

    <section class="card" aria-labelledby="capture-title">
      <h2 id="capture-title">Yakalanan fotoğraf</h2>
      <div class="capture-preview-wrap">
        <img id="capture-preview" alt="" hidden />
        <div id="capture-placeholder" class="preview-placeholder">Henüz fotoğraf yok</div>
      </div>
    </section>

    <section class="card" aria-labelledby="debug-title">
      <h2 id="debug-title">Durum</h2>
      <pre id="debug-panel" class="debug-panel" aria-live="polite">Hazır.</pre>
    </section>
  </div>

  <canvas id="capture-canvas" aria-hidden="true"></canvas>

  <style>
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>

  <script>
    (function () {
      "use strict";

      var liveVideo = document.getElementById("live-video");
      var livePlaceholder = document.getElementById("live-placeholder");
      var capturePreview = document.getElementById("capture-preview");
      var capturePlaceholder = document.getElementById("capture-placeholder");
      var captureCanvas = document.getElementById("capture-canvas");
      var errorEl = document.getElementById("error");
      var debugPanel = document.getElementById("debug-panel");
      var btnStart = document.getElementById("btn-start");
      var btnStop = document.getElementById("btn-stop");
      var btnSwitch = document.getElementById("btn-switch");
      var btnCapture = document.getElementById("btn-capture");
      var btnDownload = document.getElementById("btn-download");

      var stream = null;
      var videoDevices = [];
      var activeDeviceIndex = -1;
      var facingMode = "user";
      var useDeviceIdSwitch = false;
      var activeCameraLabel = "—";
      var lastCaptureResult = "—";
      var capturedBlob = null;
      var capturedObjectUrl = null;
      var videoReady = false;

      var debugState = {
        cameraLabel: "—",
        videoSize: "0 × 0",
        deviceCount: 0,
        switchMode: "—",
        captureResult: "—",
        streamState: "kapalı",
      };

      function setError(message) {
        if (!message) {
          errorEl.textContent = "";
          errorEl.classList.remove("is-visible");
          return;
        }
        errorEl.textContent = message;
        errorEl.classList.add("is-visible");
      }

      function renderDebug() {
        debugPanel.textContent =
          "Kamera: " +
          debugState.cameraLabel +
          "\nVideo: " +
          debugState.videoSize +
          "\nVideo cihaz sayısı: " +
          debugState.deviceCount +
          "\nGeçiş modu: " +
          debugState.switchMode +
          "\nAkış: " +
          debugState.streamState +
          "\nSon çekim: " +
          debugState.captureResult;
      }

      function updateDebug(patch) {
        var key;
        for (key in patch) {
          if (Object.prototype.hasOwnProperty.call(patch, key)) {
            debugState[key] = patch[key];
          }
        }
        renderDebug();
      }

      function revokeCapturedUrl() {
        if (capturedObjectUrl) {
          URL.revokeObjectURL(capturedObjectUrl);
          capturedObjectUrl = null;
        }
      }

      function clearCapturedPreview() {
        revokeCapturedUrl();
        capturedBlob = null;
        capturePreview.hidden = true;
        capturePreview.removeAttribute("src");
        capturePlaceholder.style.display = "flex";
        btnDownload.disabled = true;
      }

      function stopTracks() {
        if (!stream) return;
        stream.getTracks().forEach(function (track) {
          try {
            track.stop();
          } catch (_err) {
            /* ignore */
          }
        });
        stream = null;
      }

      function setCaptureEnabled(enabled) {
        videoReady = enabled;
        btnCapture.disabled = !enabled;
      }

      function updateVideoSizeDebug() {
        var w = liveVideo.videoWidth || 0;
        var h = liveVideo.videoHeight || 0;
        updateDebug({ videoSize: w + " × " + h });
        return w > 0 && h > 0;
      }

      function stopCamera() {
        stopTracks();
        liveVideo.srcObject = null;
        livePlaceholder.style.display = "flex";
        btnStart.disabled = false;
        btnStop.disabled = true;
        btnSwitch.disabled = true;
        setCaptureEnabled(false);
        activeDeviceIndex = -1;
        activeCameraLabel = "—";
        updateDebug({
          cameraLabel: "—",
          videoSize: "0 × 0",
          streamState: "kapalı",
          switchMode: videoDevices.length <= 1 ? "tek kamera" : useDeviceIdSwitch ? "deviceId" : "facingMode",
        });
      }

      function isMediaSupported() {
        return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
      }

      function mapGetUserMediaError(err) {
        var name = err && err.name ? String(err.name) : "";
        if (name === "NotAllowedError" || name === "PermissionDeniedError") {
          return "İzin reddedildi: kamera erişimi için tarayıcı izni gerekli.";
        }
        if (name === "NotFoundError" || name === "DevicesNotFoundError") {
          return "Kamera kullanılamıyor: uygun bir kamera bulunamadı.";
        }
        if (name === "NotReadableError" || name === "TrackStartError") {
          return "Kamera kullanılamıyor: cihaz başka bir uygulama tarafından kullanılıyor olabilir.";
        }
        if (name === "OverconstrainedError") {
          return "Kamera kullanılamıyor: seçilen kamera modu desteklenmiyor.";
        }
        if (name === "SecurityError") {
          return "Kamera kullanılamıyor: güvenli bağlam (HTTPS veya localhost) gerekli.";
        }
        return "Kamera kullanılamıyor: " + ((err && err.message) || "bilinmeyen hata");
      }

      function refreshVideoDevices() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {
          videoDevices = [];
          updateDebug({ deviceCount: 0 });
          return Promise.resolve(videoDevices);
        }
        return navigator.mediaDevices.enumerateDevices().then(function (devices) {
          videoDevices = devices.filter(function (d) {
            return d.kind === "videoinput";
          });
          useDeviceIdSwitch = videoDevices.length >= 2;
          updateDebug({
            deviceCount: videoDevices.length,
            switchMode:
              videoDevices.length <= 1
                ? "tek kamera (devre dışı)"
                : useDeviceIdSwitch
                  ? "deviceId"
                  : "facingMode",
          });
          return videoDevices;
        });
      }

      function updateSwitchButton() {
        if (videoDevices.length <= 1) {
          btnSwitch.disabled = true;
          btnSwitch.title = "Yalnızca bir kamera bulundu";
          return;
        }
        btnSwitch.disabled = !stream;
        btnSwitch.title = useDeviceIdSwitch ? "Sonraki video cihazına geç" : "Ön/arka kamera (facingMode)";
      }

      function resolveActiveLabel(mediaStream) {
        if (activeDeviceIndex >= 0 && videoDevices[activeDeviceIndex]) {
          var dev = videoDevices[activeDeviceIndex];
          return dev.label || "Kamera " + (activeDeviceIndex + 1);
        }
        if (mediaStream) {
          var track = mediaStream.getVideoTracks()[0];
          if (track && track.label) return track.label;
        }
        return facingMode === "environment" ? "Arka kamera" : "Ön kamera";
      }

      function syncActiveDeviceFromStream() {
        if (!stream || !videoDevices.length) {
          return;
        }
        var track = stream.getVideoTracks()[0];
        var settings = track && track.getSettings ? track.getSettings() : {};
        var currentId = settings.deviceId;
        if (currentId) {
          for (var i = 0; i < videoDevices.length; i++) {
            if (videoDevices[i].deviceId === currentId) {
              activeDeviceIndex = i;
              activeCameraLabel = resolveActiveLabel(stream);
              updateDebug({ cameraLabel: activeCameraLabel });
              return;
            }
          }
        }
        if (activeDeviceIndex < 0) {
          activeDeviceIndex = 0;
        }
        activeCameraLabel = resolveActiveLabel(stream);
        updateDebug({ cameraLabel: activeCameraLabel });
      }

      function buildVideoConstraints() {
        if (useDeviceIdSwitch && activeDeviceIndex >= 0 && videoDevices[activeDeviceIndex]) {
          return {
            audio: false,
            video: {
              deviceId: { exact: videoDevices[activeDeviceIndex].deviceId },
              width: { ideal: 1920 },
              height: { ideal: 1080 },
            },
          };
        }
        return {
          audio: false,
          video: {
            facingMode: { ideal: facingMode },
            width: { ideal: 1920 },
            height: { ideal: 1080 },
          },
        };
      }

      function waitForVideoReady(video) {
        return new Promise(function (resolve, reject) {
          function readyNow() {
            return video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA && video.videoWidth > 0 && video.videoHeight > 0;
          }

          if (readyNow()) {
            resolve();
            return;
          }

          var timeout = window.setTimeout(function () {
            cleanup();
            reject(new Error("video-not-ready"));
          }, 12000);

          function cleanup() {
            window.clearTimeout(timeout);
            video.removeEventListener("loadedmetadata", onEvent);
            video.removeEventListener("loadeddata", onEvent);
            video.removeEventListener("canplay", onEvent);
            video.removeEventListener("playing", onEvent);
          }

          function onEvent() {
            if (readyNow()) {
              cleanup();
              resolve();
            }
          }

          video.addEventListener("loadedmetadata", onEvent);
          video.addEventListener("loadeddata", onEvent);
          video.addEventListener("canplay", onEvent);
          video.addEventListener("playing", onEvent);
        });
      }

      function attachStream(mediaStream) {
        stream = mediaStream;
        liveVideo.srcObject = mediaStream;
        liveVideo.muted = true;
        setCaptureEnabled(false);

        var playPromise;
        try {
          playPromise = liveVideo.play();
        } catch (playErr) {
          return Promise.reject(playErr);
        }

        return Promise.resolve(playPromise)
          .catch(function () {
            /* iOS may reject first play; waitForVideoReady still applies */
          })
          .then(function () {
            return waitForVideoReady(liveVideo);
          })
          .then(function () {
            if (!updateVideoSizeDebug()) {
              throw new Error("video-not-ready");
            }
            activeCameraLabel = resolveActiveLabel(mediaStream);
            livePlaceholder.style.display = "none";
            btnStart.disabled = true;
            btnStop.disabled = false;
            updateSwitchButton();
            setCaptureEnabled(true);
            updateDebug({
              cameraLabel: activeCameraLabel,
              streamState: "açık",
              captureResult: lastCaptureResult,
            });
            setError("");
          });
      }

      function openCameraStream() {
        setError("");
        setCaptureEnabled(false);
        stopTracks();
        liveVideo.srcObject = null;
        updateDebug({ streamState: "açılıyor…", videoSize: "0 × 0" });

        return navigator.mediaDevices.getUserMedia(buildVideoConstraints()).then(function (mediaStream) {
          return attachStream(mediaStream);
        });
      }

      function startCamera() {
        clearCapturedPreview();
        lastCaptureResult = "—";
        updateDebug({ captureResult: lastCaptureResult });

        if (!isMediaSupported()) {
          setError("Desteklenmeyen tarayıcı: getUserMedia bu ortamda kullanılamıyor.");
          updateDebug({ streamState: "desteklenmiyor" });
          return;
        }

        if (location.protocol === "file:") {
          setError(
            "file:// protokolünde kamera erişimi tarayıcıya göre engellenebilir. Lütfen http://localhost veya HTTPS kullanın."
          );
        }

        btnStart.disabled = true;
        activeDeviceIndex = -1;

        openCameraStream()
          .then(function () {
            return refreshVideoDevices();
          })
          .then(function () {
            syncActiveDeviceFromStream();
            updateSwitchButton();
          })
          .catch(function (err) {
            if (useDeviceIdSwitch && err && err.name === "OverconstrainedError") {
              useDeviceIdSwitch = false;
              facingMode = facingMode === "user" ? "environment" : "user";
              activeDeviceIndex = -1;
              updateDebug({ switchMode: "facingMode (fallback)" });
              return openCameraStream().then(function () {
                return refreshVideoDevices();
              });
            }
            throw err;
          })
          .then(function () {
            syncActiveDeviceFromStream();
            updateSwitchButton();
          })
          .catch(function (err) {
            stopCamera();
            btnStart.disabled = false;
            var msg =
              err && err.message === "video-not-ready"
                ? "Video hazır değil: kamera karesi gelmedi. Tekrar deneyin."
                : mapGetUserMediaError(err);
            setError(msg);
            updateDebug({ streamState: "hata", captureResult: msg });
          });
      }

      function switchCamera() {
        if (videoDevices.length <= 1) {
          setError("Yalnızca bir kamera var; geçiş yapılamıyor.");
          updateDebug({ switchMode: "tek kamera (devre dışı)" });
          return;
        }

        setError("");
        lastCaptureResult = "—";

        if (useDeviceIdSwitch) {
          activeDeviceIndex = (activeDeviceIndex + 1) % videoDevices.length;
        } else {
          facingMode = facingMode === "user" ? "environment" : "user";
          activeDeviceIndex = -1;
        }

        btnSwitch.disabled = true;
        setCaptureEnabled(false);
        updateDebug({ streamState: "kamera değiştiriliyor…" });

        openCameraStream()
          .then(function () {
            return refreshVideoDevices();
          })
          .then(function () {
            syncActiveDeviceFromStream();
            updateSwitchButton();
          })
          .catch(function (err) {
            if (useDeviceIdSwitch && err && err.name === "OverconstrainedError") {
              useDeviceIdSwitch = false;
              facingMode = facingMode === "user" ? "environment" : "user";
              activeDeviceIndex = -1;
              updateDebug({ switchMode: "facingMode (fallback)" });
              return openCameraStream().then(function () {
                return refreshVideoDevices();
              });
            }
            throw err;
          })
          .then(function () {
            syncActiveDeviceFromStream();
            updateSwitchButton();
          })
          .catch(function (err) {
            stopCamera();
            btnStart.disabled = false;
            var msg =
              err && err.message === "video-not-ready"
                ? "Video hazır değil: yeni kamera karesi gelmedi."
                : mapGetUserMediaError(err);
            setError(msg);
            updateDebug({ streamState: "hata", captureResult: msg });
          });
      }

      function capturePhoto() {
        setError("");

        if (!stream) {
          var noStreamMsg = "Video hazır değil: önce kamerayı açın.";
          setError(noStreamMsg);
          lastCaptureResult = "hata: " + noStreamMsg;
          updateDebug({ captureResult: lastCaptureResult });
          return;
        }

        if (!videoReady) {
          var notReadyMsg = "Video hazır değil: kamera henüz hazır değil.";
          setError(notReadyMsg);
          lastCaptureResult = "hata: " + notReadyMsg;
          updateDebug({ captureResult: lastCaptureResult });
          return;
        }

        var width = liveVideo.videoWidth;
        var height = liveVideo.videoHeight;
        if (!width || !height) {
          var dimMsg = "Video hazır değil: boyut " + width + " × " + height + ".";
          setError(dimMsg);
          lastCaptureResult = "hata: " + dimMsg;
          updateDebug({ videoSize: width + " × " + height, captureResult: lastCaptureResult });
          return;
        }

        captureCanvas.width = width;
        captureCanvas.height = height;

        var ctx = captureCanvas.getContext("2d", { alpha: false });
        if (!ctx) {
          var ctxMsg = "Canvas/toBlob hatası: 2D bağlamı oluşturulamadı.";
          setError(ctxMsg);
          lastCaptureResult = "hata: " + ctxMsg;
          updateDebug({ captureResult: lastCaptureResult });
          return;
        }

        try {
          requestAnimationFrame(function () {
            try {
              ctx.drawImage(liveVideo, 0, 0, width, height);
            } catch (drawErr) {
              var drawMsg = "Video hazır değil: kare yakalanamadı (" + (drawErr.message || drawErr) + ").";
              setError(drawMsg);
              lastCaptureResult = "hata: " + drawMsg;
              updateDebug({ captureResult: lastCaptureResult });
              return;
            }

            captureCanvas.toBlob(
              function (blob) {
                if (!blob) {
                  var blobMsg = "Canvas/toBlob hatası: JPEG üretilemedi.";
                  setError(blobMsg);
                  lastCaptureResult = "hata: " + blobMsg;
                  updateDebug({ captureResult: lastCaptureResult });
                  return;
                }
                revokeCapturedUrl();
                capturedBlob = blob;
                capturedObjectUrl = URL.createObjectURL(blob);
                capturePreview.src = capturedObjectUrl;
                capturePreview.alt = "Yakalanan fotoğraf önizlemesi";
                capturePreview.hidden = false;
                capturePlaceholder.style.display = "none";
                btnDownload.disabled = false;
                lastCaptureResult = "OK — " + width + " × " + height + ", " + Math.round(blob.size / 1024) + " KB";
                updateDebug({ captureResult: lastCaptureResult, videoSize: width + " × " + height });
                setError("");
              },
              "image/jpeg",
              0.92
            );
          });
        } catch (drawErr) {
          var outerDrawMsg = "Video hazır değil: kare yakalanamadı (" + (drawErr.message || drawErr) + ").";
          setError(outerDrawMsg);
          lastCaptureResult = "hata: " + outerDrawMsg;
          updateDebug({ captureResult: lastCaptureResult });
          return;
        }
      }

      function downloadJpg() {
        if (!capturedBlob) {
          setError("Henüz indirilecek fotoğraf yok.");
          return;
        }
        var url = capturedObjectUrl || URL.createObjectURL(capturedBlob);
        var temporary = !capturedObjectUrl;
        var anchor = document.createElement("a");
        var stamp = new Date().toISOString().replace(/[:.]/g, "-");
        anchor.href = url;
        anchor.download = "lumos-camera-" + stamp + ".jpg";
        anchor.rel = "noopener";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        if (temporary) {
          URL.revokeObjectURL(url);
        }
      }

      function cleanupAll() {
        stopCamera();
        revokeCapturedUrl();
      }

      btnStart.addEventListener("click", startCamera);
      btnStop.addEventListener("click", function () {
        setError("");
        stopCamera();
      });
      btnSwitch.addEventListener("click", switchCamera);
      btnCapture.addEventListener("click", capturePhoto);
      btnDownload.addEventListener("click", downloadJpg);
      window.addEventListener("pagehide", cleanupAll);
      window.addEventListener("beforeunload", cleanupAll);

      liveVideo.addEventListener("loadedmetadata", updateVideoSizeDebug);
      liveVideo.addEventListener("resize", updateVideoSizeDebug);

      if (!isMediaSupported()) {
        setError("Desteklenmeyen tarayıcı: getUserMedia bu ortamda kullanılamıyor.");
        btnStart.disabled = true;
        updateDebug({ streamState: "desteklenmiyor" });
      } else {
        renderDebug();
      }
    })();
  </script>
</body>
</html>
