      <stop offset="0" stop-color="#fff1c4"/>
      <stop offset="0.45" stop-color="#d9a84b"/>
      <stop offset="1" stop-color="#7a4d12"/>
    </linearGradient>
    <radialGradient id="icon-field" cx="32" cy="24" r="34" gradientUnits="userSpaceOnUse">
